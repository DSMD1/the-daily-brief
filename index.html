<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daily Brief</title><style>
:root{color-scheme:light;--bg:#f7f6f2;--fg:#18231f;--muted:#68736d;--line:#d8dcd5;--panel:#fff;--accent:#285b49}html[data-theme=dark]{color-scheme:dark;--bg:#141b19;--fg:#e7eae4;--muted:#a9b5ad;--line:#38443e;--panel:#202a25;--accent:#a5d5b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:12px;letter-spacing:2px}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}h1{font:clamp(42px,8vw,84px)/1.05 Georgia,serif;letter-spacing:-3px;margin:24px 0 8px}h2{font:30px Georgia,serif;margin:28px 0 14px}h3{font-size:20px;line-height:1.45;margin:8px 0}p{margin:8px 0}.muted,small{color:var(--muted)}.meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:20px 0}nav{display:flex;gap:8px;flex-wrap:wrap;border-block:1px solid var(--line);padding:12px 0}nav button{border:0;background:transparent}nav button.active{background:var(--accent);color:var(--bg)}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}.tag{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px}.number{font:36px Georgia,serif;color:var(--muted)}.story{padding:20px 0;border-bottom:1px solid var(--line)}details{margin-top:12px}summary{cursor:pointer;color:var(--accent)}a{color:var(--accent)}footer{margin-top:36px;border-top:1px solid var(--line);padding:16px 0;color:var(--muted);font-size:12px}@media(max-width:700px){main{padding:16px}.top{grid-template-columns:1fr}h1{letter-spacing:-2px}}
</style></head><body><main><header><strong>PERSONAL INTELLIGENCE</strong><button id="theme" aria-label="切換色彩模式">◐</button></header><h1>The Daily Brief.</h1><p class="muted">Stay informed. Understand what matters.</p><div class="meta"><span id="date"></span><label>日期 <select id="archive" aria-label="新聞日期"></select></label></div><p id="status" class="muted" role="status"></p><nav id="nav" aria-label="新聞分類"></nav><section id="topSection"><h2>Top Stories</h2><div class="top" id="top"></div></section><section><h2 id="heading">Daily Briefing</h2><div id="stories"></div></section><footer>THE DAILY BRIEF · AI-assisted news digest · 請以新聞原文為準</footer></main><script>
const categories=['全部','國際','香港','中國','台灣','商業經濟','科技 AI','熱門趨勢'];
const demo={date:null,demo:true,stories:categories.slice(1).map((category,i)=>({category,title:['全球重要外交與政治動態','香港政策及民生資訊','中國政策與經濟動態','台灣市場及社會動態','全球經濟與企業趨勢','人工智能與科技發展','值得關注的社會文化趨勢'][i],summary:'這是版面示範，尚未接入即時新聞。',context:'正式版本將提供必要的事件背景。',importance:'正式版本將說明這則新聞為什麼值得關注。',sources:[]}))};
let data=demo,active='全部';const $=id=>document.getElementById(id);const el=(tag,txt,cls)=>{let n=document.createElement(tag);if(txt!=null)n.textContent=txt;if(cls)n.className=cls;return n};
function render(){ $('date').textContent=data.date||'PREVIEW EDITION';$('status').textContent=data.demo?'示範資料 · 尚未連接即時新聞來源':'新聞日期：'+data.date+' · AI 輔助摘要';$('nav').replaceChildren(...categories.map(c=>{let b=el('button',c,c===active?'active':'');b.setAttribute('aria-pressed',String(c===active));b.onclick=()=>{active=c;render()};return b}));$('topSection').hidden=active!=='全部';$('top').replaceChildren(...data.stories.slice(0,3).map((s,i)=>{let a=el('article',null,'card');a.append(el('div',String(i+1).padStart(2,'0'),'number'),el('div',s.category,'tag'),el('h3',s.title),el('p',s.summary));return a}));$('heading').textContent=active==='全部'?'Daily Briefing':active;let ss=data.stories.filter(s=>active==='全部'||s.category===active);$('stories').replaceChildren(...ss.map(s=>{let a=el('article',null,'story');a.append(el('div',s.category,'tag'),el('h3',s.title),el('p',s.summary));let d=el('details');d.append(el('summary','閱讀背景與影響'),el('h4','Context / 背景'),el('p',s.context||'暫無資料'),el('h4','Why it matters / 重要性'),el('p',s.importance||'暫無資料'));for(let source of s.sources||[]){try{let u=new URL(source.url);if(!['http:','https:'].includes(u.protocol))continue;let link=el('a',source.name||u.hostname);link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';let p=el('p');p.append(link);d.append(p)}catch{}}a.append(d);return a}));if(!ss.length)$('stories').append(el('p','此分類暫無新聞。','muted'))}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch{}}try{theme(localStorage.getItem('theme')||'light')}catch{}$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
async function load(path){try{let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error();let j=await r.json();if(!Array.isArray(j.stories))throw Error();data=j;active='全部';render();return true}catch{return false}}
async function init(){render();let a=$('archive');a.append(new Option('示範版','demo'));if(await load('data/latest.json')){a.replaceChildren(new Option('最新一期','data/latest.json'));try{let r=await fetch('data/archive.json');if(r.ok){let dates=await r.json();for(let date of dates){if(/^\d{4}-\d{2}-\d{2}$/.test(date))a.append(new Option(date,'data/'+date+'.json'))}}}catch{}}a.onchange=async()=>{if(a.value==='demo'){data=demo;render()}else if(!await load(a.value))$('status').textContent='無法讀取所選日期，保留目前內容。'}}init();
</script></body></html>
